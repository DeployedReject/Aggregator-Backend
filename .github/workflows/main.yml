name: Build and Deploy Backend

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Package Artifact on GitHub
        run: ./mvnw clean package -DskipTests

      - name: Publish Built Artifact to GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Automated Backend Build
          prerelease: false
          files: target/Aggregator-backend-0.0.1-SNAPSHOT.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Server deploy.sh via Webhook
        run: |
          ARTIFACT_URL="https://github.com/${{ github.repository }}/releases/download/latest-build/Aggregator-backend-0.0.1-SNAPSHOT.jar"
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://aggregator-registry.mishravaibhav2048.workers.dev/api/v1/webhook/backend-deploy" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${{ secrets.SERVER_WEBHOOK_SECRET }}" \
            -d "{\"downloadUrl\": \"$ARTIFACT_URL\"}")
          
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Deployment Response:"
          echo "$BODY"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Success: Server received deploy trigger, began zero-data-loss backup and service reload."
            exit 0
          else
            echo "Error: Server returned HTTP status $STATUS"
            exit 1
          fi
